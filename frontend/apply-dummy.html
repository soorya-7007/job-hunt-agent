<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Dummy Job Application — JobHunt AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8 text-center space-y-6">
    <div class="w-16 h-16 mx-auto bg-blue-100 rounded-full flex items-center justify-center text-blue-600">
      <span class="material-symbols-outlined text-3xl">work</span>
    </div>
    <h1 class="text-2xl font-bold text-gray-900">External Job Site Simulator</h1>
    <p class="text-gray-600">
      This is a common dummy application page because the selected job was from our offline sample dataset and doesn't have a real application URL.
    </p>
    <div class="p-4 bg-gray-50 rounded-lg text-left text-sm text-gray-500 border border-gray-200">
      Normally, you would see the company's real application portal (like Workday, Greenhouse, or Lever) here.
    </div>
    <button onclick="window.close()" class="w-full h-10 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-sm transition-colors">
      Close Window
    </button>
  </div>
</body>
</html>
