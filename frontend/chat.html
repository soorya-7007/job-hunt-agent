<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Chat Assistant — JobHunt AI</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: { sans: ["Inter", "sans-serif"] },
          colors: {
            "surface-1": "#0f172a",
            "surface-2": "#1e293b",
            "surface-3": "#334155",
            "accent-primary": "#3b82f6",
            "accent-secondary": "#6366f1"
          }
        }
      }
    };
  </script>
</head>

<body class="bg-surface-1 text-slate-200 antialiased h-screen flex flex-col font-sans">

  <!-- Navigation -->
  <header
    class="bg-surface-2/80 backdrop-blur-md border-b border-surface-3 flex items-center justify-between px-6 h-16 sticky top-0 z-50 shrink-0">
    <div class="flex items-center gap-2">
      <div
        class="w-8 h-8 rounded-lg bg-gradient-to-br from-accent-primary to-accent-secondary flex items-center justify-center">
        <span class="material-symbols-outlined text-white text-lg">work</span>
      </div>
      <span class="font-bold text-lg text-white">JobHunt AI</span>
    </div>
    <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
      <a href="/" class="text-slate-400 hover:text-white transition-colors">Home</a>
      <a href="/jobs" class="text-slate-400 hover:text-white transition-colors">Discover</a>
      <a href="/dashboard" class="text-slate-400 hover:text-white transition-colors">Dashboard</a>
      <a href="/profile" class="text-slate-400 hover:text-white transition-colors">Profile</a>
      <a href="/chat" class="text-accent-primary transition-colors flex items-center gap-1"><span
          class="material-symbols-outlined text-sm">chat</span> Assistant</a>
    </nav>
  </header>

  <!-- Chat Area -->
  <main class="flex-1 overflow-hidden flex flex-col max-w-4xl w-full mx-auto p-4 sm:p-6 h-full">

    <!-- Header -->
    <div class="text-center mb-6 shrink-0">
      <h1 class="text-2xl font-bold text-white mb-2">Job Search Assistant</h1>
      <p class="text-slate-400 text-sm">Ask me to find jobs, e.g. "Find remote React jobs" or "Are there any data
        engineer roles?"</p>
    </div>

    <!-- Messages Container -->
    <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 mb-4 pr-2 flex flex-col">

      <!-- Welcome Message -->
      <div class="flex gap-4 self-start max-w-[85%]">
        <div class="w-8 h-8 rounded-full bg-surface-3 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-accent-primary text-sm">robot_2</span>
        </div>
        <div class="bg-surface-2 rounded-2xl rounded-tl-sm p-4 text-sm text-slate-300 shadow-md">
          <p>Hi there! I'm your AI job search assistant. What kind of roles are you looking for today?</p>
        </div>
      </div>

    </div>

    <!-- Input Area -->
    <div class="shrink-0 bg-surface-2 rounded-xl border border-surface-3 p-2 shadow-lg relative">
      <form id="chat-form" class="flex items-center gap-2">
        <input type="text" id="chat-input"
          class="flex-1 bg-transparent border-none text-white placeholder-slate-500 focus:outline-none focus:ring-0 text-sm px-4 py-2"
          placeholder="Message JobHunt AI..." autocomplete="off" />
        <button type="submit" id="chat-submit"
          class="bg-accent-primary hover:bg-blue-500 text-white w-10 h-10 rounded-lg flex items-center justify-center transition-colors shrink-0 disabled:opacity-50">
          <span class="material-symbols-outlined text-xl">send</span>
        </button>
      </form>
    </div>

  </main>

  <script src="/static/js/api.js"></script>
  <script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('chat-input');
    const messages = document.getElementById('chat-messages');
    const submitBtn = document.getElementById('chat-submit');

    // Utility to parse simple markdown to HTML (bold and lists)
    function parseMarkdown(text) {
      let html = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\n/g, '<br/>');
      return html;
    }

    function addMessage(text, isUser = false) {
      const wrapper = document.createElement('div');
      wrapper.className = `flex gap-4 max-w-[85%] ${isUser ? 'self-end flex-row-reverse' : 'self-start'}`;

      const avatar = document.createElement('div');
      avatar.className = `w-8 h-8 rounded-full flex items-center justify-center shrink-0 ${isUser ? 'bg-accent-primary' : 'bg-surface-3'}`;
      avatar.innerHTML = `<span class="material-symbols-outlined ${isUser ? 'text-white' : 'text-accent-primary'} text-sm">${isUser ? 'person' : 'robot_2'}</span>`;

      const bubble = document.createElement('div');
      bubble.className = `rounded-2xl p-4 text-sm shadow-md ${isUser ? 'bg-accent-primary text-white rounded-tr-sm' : 'bg-surface-2 text-slate-300 rounded-tl-sm'}`;
      bubble.innerHTML = isUser ? text : parseMarkdown(text);

      wrapper.appendChild(avatar);
      wrapper.appendChild(bubble);
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;
    }

    function addLoading() {
      const wrapper = document.createElement('div');
      wrapper.id = 'chat-loading';
      wrapper.className = 'flex gap-4 self-start max-w-[85%]';
      wrapper.innerHTML = `
        <div class="w-8 h-8 rounded-full bg-surface-3 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-slate-400 text-sm animate-pulse">more_horiz</span>
        </div>
      `;
      messages.appendChild(wrapper);
      messages.scrollTop = messages.scrollHeight;
    }

    function removeLoading() {
      const el = document.getElementById('chat-loading');
      if (el) el.remove();
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, true);
      input.value = '';
      submitBtn.disabled = true;
      addLoading();

      try {
        const response = await API.chat(text);
        removeLoading();
        addMessage(response.reply, false);
      } catch (err) {
        removeLoading();
        addMessage("Sorry, I encountered an error connecting to the server.", false);
      } finally {
        submitBtn.disabled = false;
        input.focus();
      }
    });
  </script>
</body>

</html>
